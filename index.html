<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ECO Pilot — Status</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/styles.css" />
    <script>
      (function () {
        "use strict";
        try {
          var theme = localStorage.getItem("eco-pilot-theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (err) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <div class="site-header__brand">
          <h1 id="site-title" class="site-header__title">ECO Pilot</h1>
          <p id="site-tagline" class="site-header__tagline">Pilot status page</p>
        </div>
        <div class="theme-toggle" role="group" aria-label="Color theme">
          <button
            type="button"
            class="theme-toggle__btn"
            id="theme-light"
            aria-pressed="false"
          >
            Light
          </button>
          <button
            type="button"
            class="theme-toggle__btn"
            id="theme-dark"
            aria-pressed="false"
          >
            Dark
          </button>
        </div>
      </div>
    </header>

    <main class="site-main">
      <div id="sections-root" class="sections" aria-live="polite">
        <p class="site-main__loading">Loading status…</p>
      </div>

      <section class="changelog" aria-labelledby="changelog-heading">
        <h2 id="changelog-heading" class="changelog__title">Changelog</h2>
        <div id="changelog-root" class="changelog__root">
          <p class="site-main__loading">Loading changelog…</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p class="site-footer__meta">
          Deployed
          <time id="build-date" datetime="__BUILD_DATE_ISO__">__BUILD_DATE__</time>
          · commit
          <code id="commit-sha">__COMMIT_SHA__</code>
        </p>
      </div>
    </footer>

    <script src="./js/main.js" defer></script>
  </body>
</html>
